services:
  postgres:
    image: postgres:16-alpine
    container_name: leany-pokemon-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leany_pokemon
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
